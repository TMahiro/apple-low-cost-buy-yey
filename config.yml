# ============================================================
# Apple整備済製品 監視設定
# ============================================================

# 監視・通知のオンオフ
# true: 有効 / false: 無効（取得・通知ともに停止）
enabled: true

# ============================================================
# 監視対象モデル
# ============================================================
# name    : わかりやすい名前（ログ表示用）
# keywords: 製品名に含まれるキーワード（すべて一致で対象）
#           大文字小文字は区別しない
# ============================================================
targets:
  - name: MacBook Pro 14インチ M5 24GB
    keywords:
      - "MacBook Pro"
      - "14"
      - "M5"
      - "24GB"

  - name: MacBook Pro 14インチ M5 Pro 24GB
    keywords:
      - "MacBook Pro"
      - "14"
      - "M5 Pro"
      - "24GB"

  # 監視対象を追加する場合は以下のようにコピーして追記
  # - name: MacBook Pro 16インチ M5 Pro
  #   keywords:
  #     - "MacBook Pro"
  #     - "16"
  #     - "M5 Pro"
